<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signal</title>
  <link rel="stylesheet" href="./stage.css" />
  <style>
    #root {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      color: #f4f1ea;
      font-family: Syne, sans-serif;
      background:
        radial-gradient(680px 420px at 78% 42%, rgba(255, 183, 3, 0.16), transparent 70%),
        #0c0d10;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(244, 241, 234, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244, 241, 234, 0.05) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
    }
    .word {
      position: absolute;
      left: 72px;
      top: 248px;
      margin: 0;
      font-size: 112px;
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 0.85;
      opacity: 0;
    }
    .device {
      position: absolute;
      right: 72px;
      top: 188px;
      width: 420px;
      height: 280px;
    }
    .edge {
      position: absolute;
      background: #ffb703;
    }
    .edge.top, .edge.bottom { height: 4px; left: 0; right: 0; }
    .edge.left, .edge.right { width: 4px; top: 0; bottom: 0; }
    .edge.top { top: 0; transform-origin: left center; transform: scaleX(0); }
    .edge.right { right: 0; transform-origin: center top; transform: scaleY(0); }
    .edge.bottom { bottom: 0; transform-origin: right center; transform: scaleX(0); }
    .edge.left { left: 0; transform-origin: center bottom; transform: scaleY(0); }
    .inside {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 78px;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #ffb703;
      opacity: 0;
    }
    .rail {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 108px;
      height: 3px;
      background: rgba(244, 241, 234, 0.16);
    }
    .playhead {
      height: 3px;
      width: 100%;
      background: #ffb703;
      transform-origin: left center;
      transform: scaleX(0);
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="signal"
    data-start="0"
    data-duration="4"
    data-width="1280"
    data-height="720"
    data-fps="30"
  >
    <div class="grid"></div>
    <p class="kicker" id="kicker">01 — signal</p>
    <h1 class="word" id="word">HTML</h1>
    <div class="device">
      <span class="edge top" id="edge-top"></span>
      <span class="edge right" id="edge-right"></span>
      <span class="edge bottom" id="edge-bottom"></span>
      <span class="edge left" id="edge-left"></span>
      <div class="inside" id="inside">MP4</div>
    </div>
    <div class="rail"><div class="playhead" id="playhead"></div></div>
    <p class="caption" id="caption">Write the frame. Seek to it.</p>
  </div>
  <script src="./vendor/gsap.min.js"></script>
  <script>
    gsap.defaults({ force3D: false });
    const timeline = gsap.timeline({ paused: true });
    timeline.fromTo("#kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
    timeline.fromTo("#word", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.15);
    timeline.fromTo("#edge-top", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.9);
    timeline.fromTo("#edge-right", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 1.1);
    timeline.fromTo("#edge-bottom", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.3);
    timeline.fromTo("#edge-left", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 1.5);
    timeline.fromTo("#inside", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.85);
    timeline.fromTo("#caption", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.35);
    timeline.fromTo("#playhead", { scaleX: 0 }, { scaleX: 1, duration: 4, ease: "none" }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines.signal = timeline;
  </script>
</body>
</html>
