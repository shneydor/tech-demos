<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orbit</title>
  <link rel="stylesheet" href="./stage.css" />
  <style>
    #root {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      color: #f4f1ea;
      font-family: Syne, sans-serif;
      background:
        radial-gradient(540px 540px at 50% 46%, rgba(126, 224, 198, 0.14), transparent 68%),
        #0e1210;
    }
    .rings { position: absolute; left: 640px; top: 336px; width: 0; height: 0; }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(126, 224, 198, 0.55);
      opacity: 0;
    }
    .ring i {
      position: absolute;
      top: -7px;
      left: 50%;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: #7ee0c6;
    }
    .r1 { width: 540px; height: 540px; margin: -270px 0 0 -270px; }
    .r2 { width: 360px; height: 360px; margin: -180px 0 0 -180px; }
    .r3 { width: 200px; height: 200px; margin: -100px 0 0 -100px; }
    .center {
      position: absolute;
      left: 0;
      right: 0;
      top: 336px;
      height: 0;
      display: grid;
      place-items: center;
    }
    .center span {
      grid-area: 1 / 1;
      font-size: 76px;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      opacity: 0;
    }
    #c2 { color: #7ee0c6; }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="orbit"
    data-start="0"
    data-duration="4"
    data-width="1280"
    data-height="720"
    data-fps="30"
  >
    <p class="kicker" id="kicker">02 — orbit</p>
    <div class="rings">
      <div class="ring r1" id="r1"><i></i></div>
      <div class="ring r2" id="r2"><i></i></div>
      <div class="ring r3" id="r3"><i></i></div>
    </div>
    <div class="center">
      <span id="c1">ONE</span>
      <span id="c2">FILE</span>
    </div>
    <p class="caption" id="caption">Same seek, every run.</p>
  </div>
  <script src="./vendor/gsap.min.js"></script>
  <script>
    gsap.defaults({ force3D: false });
    const timeline = gsap.timeline({ paused: true });
    timeline.fromTo("#kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
    timeline.fromTo("#r1", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 0.1);
    timeline.fromTo("#r2", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 0.18);
    timeline.fromTo("#r3", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 0.26);
    timeline.fromTo("#r1", { rotation: 0 }, { rotation: 150, duration: 4, ease: "none" }, 0);
    timeline.fromTo("#r2", { rotation: 24 }, { rotation: -130, duration: 4, ease: "none" }, 0);
    timeline.fromTo("#r3", { rotation: -16 }, { rotation: 210, duration: 4, ease: "none" }, 0);
    timeline.fromTo("#c1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.35);
    timeline.fromTo(
      "#c1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -12, duration: 0.3, ease: "power2.in", immediateRender: false },
      1.5,
    );
    timeline.fromTo("#c2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.9);
    timeline.fromTo("#caption", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.35);
    window.__timelines = window.__timelines || {};
    window.__timelines.orbit = timeline;
  </script>
</body>
</html>
