<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello — Tech Demos</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #14161c;
      --ink: #f4f1ea;
      --muted: #9a9488;
      --accent: #e8ff6b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #1c2430 0%, transparent 50%),
        radial-gradient(800px 400px at 100% 100%, #1a1810 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100%;
    }
    main {
      width: min(28rem, calc(100% - 2.5rem));
      background: var(--card);
      border: 1px solid #2a2d36;
      border-radius: 1.25rem;
      padding: 2.25rem 2rem 2rem;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    p.kicker {
      margin: 0 0 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    p.lead {
      margin: 0 0 1.75rem;
      color: var(--muted);
      line-height: 1.5;
    }
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      background: var(--accent);
      color: #111;
      font: inherit;
      font-weight: 650;
      padding: 0.8rem 1.25rem;
      border-radius: 999px;
      min-width: 10rem;
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }
    #out {
      min-height: 1.5rem;
      margin: 1.25rem 0 0;
      font-size: 1.05rem;
      color: var(--accent);
      transition: opacity 160ms ease;
    }
    a.back {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
    }
    a.back:hover { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Tech Demos</p>
    <h1>Hello</h1>
    <p class="lead">A one-click placeholder so the gallery is never empty. Press the button.</p>
    <button type="button" id="go">Say hello</button>
    <p id="out" aria-live="polite"></p>
    <a class="back" href="../">← All demos</a>
  </main>
  <script>
    const greetings = [
      "Hello, Nir.",
      "It works. One click, no setup.",
      "The gallery is live.",
      "More demos will land here."
    ];
    let i = 0;
    const out = document.getElementById("out");
    document.getElementById("go").addEventListener("click", () => {
      out.style.opacity = "0";
      const text = greetings[i % greetings.length];
      i += 1;
      requestAnimationFrame(() => {
        setTimeout(() => {
          out.textContent = text;
          out.style.opacity = "1";
        }, 90);
      });
    });
  </script>
</body>
</html>
